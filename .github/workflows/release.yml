# Build and publish release for HATH0R ATC
# Triggers: version tags (v*) or manual workflow_dispatch.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.2)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes from CHANGELOG
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          python3 -c "
          import re, sys
          from pathlib import Path

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = r'##\s+\[?' + re.escape('${VERSION}') + r'\]?(?:\s+-\s+.*)?\n(.*?)(?=\n##\s+\[?|\Z)'
          match = re.search(pattern, changelog, re.DOTALL)
          if match:
              Path('RELEASE_NOTES.md').write_text(match.group(1).strip() + '\n', encoding='utf-8')
          else:
              Path('RELEASE_NOTES.md').write_text('Release ' + '${VERSION}' + '\n', encoding='utf-8')
          "

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag || gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
