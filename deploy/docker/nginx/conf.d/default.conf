# Hath0r-Edge — suite edge on hath0r-net
# Host: localhost:${HATH0R_NGINX_HOST_PORT:-38000}

server {
    listen 80 default_server;
    server_name _;

    # Shared edge health (does not require app upstreams)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        default_type text/plain;
        return 200 "Hath0r edge (Hath0r-Edge)\nroutes: /mcp/ /healthz /phoenix/ /mlflow/\n";
    }

    # Proxy to standalone MCP member
    location /mcp/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hath0r-Edge Hath0r-Edge;
        # Trailing slash strips /mcp/ prefix: /mcp/ready -> /ready
        proxy_pass http://Hath0r-MCP:8083/;
    }

    # Arize Phoenix Telemetry & UI
    location /phoenix/ {
        proxy_pass http://Hath0r-phoenix:6006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/traces {
        proxy_pass http://Hath0r-phoenix:6006/v1/traces;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/metrics {
        proxy_pass http://Hath0r-phoenix:6006/v1/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /otlp/ {
        proxy_pass http://Hath0r-phoenix:6006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MLflow MLOps Experiment Tracking & UI
    location /mlflow/ {
        proxy_pass http://Hathor-MLFLOW:5000/mlflow/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Apache Airflow Webserver & API (optional service)
    # location /airflow/ {
    #     proxy_pass http://Hath0r-Airflow:8080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
