# hath0r-nginx — suite edge on hath0r-net
# Host: localhost:${HATH0R_NGINX_HOST_PORT:-38000}
#
# MCP is standalone (sibling repo). Upstream resolves when hath0r-mcp is up.

upstream hath0r_mcp {
    zone mcp 64k;
    server hath0r-mcp:8083 resolve;
}

server {
    listen 80 default_server;
    server_name _;

    # Shared edge health (does not require app upstreams)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        default_type text/plain;
        return 200 "Hath0r edge (hath0r-nginx)\nroutes: /mcp/ /healthz\n";
    }

    # Optional proxy to standalone MCP member
    location /mcp/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hath0r-Edge hath0r-nginx;
        # Strip /mcp prefix so /mcp/health -> upstream /health
        proxy_pass http://hath0r_mcp/;
    }
}
