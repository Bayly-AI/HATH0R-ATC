# Hath0r Docker group (compose project: hath0r)
# Network: hath0r-net | Shared edge: hath0r-nginx | Shared state: hath0r-redis
#
# Shared infra only:
#   docker compose -f deploy/docker/docker-compose.yml up -d redis nginx
# With database profile:
#   docker compose -f deploy/docker/docker-compose.yml --profile db up -d
#
# MCP is STANDALONE (sibling repo OpenSource/hath0r-mcp). Join the same network;
# do not lifecycle-manage MCP from this compose file.

name: hath0r

services:
  redis:
    image: redis:7-alpine
    container_name: hath0r-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hath0r_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      hath0r-net:
        aliases:
          - hath0r-redis
          - redis
          - h0-redis
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: redis
      com.hath0r.container: hath0r-redis
      com.hath0r.role: shared-state

  nginx:
    image: nginx:1.27-alpine
    container_name: hath0r-nginx
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${HATH0R_NGINX_HOST_PORT:-38000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      hath0r-net:
        aliases:
          - hath0r-nginx
          - nginx
          - h0-nginx
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: nginx
      com.hath0r.container: hath0r-nginx
      com.hath0r.role: shared-edge

  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: hath0r-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hath0r}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hath0r}
      POSTGRES_DB: ${POSTGRES_DB:-hath0r}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-35432}:5432"
    volumes:
      - hath0r_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hath0r} -d ${POSTGRES_DB:-hath0r}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      hath0r-net:
        aliases:
          - hath0r-postgres
          - postgres
          - h0-postgres
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: postgres
      com.hath0r.container: hath0r-postgres
      com.hath0r.role: canonical-database

volumes:
  hath0r_redis_data:
    name: hath0r_redis_data
  hath0r_postgres_data:
    name: hath0r_postgres_data
    external: true

networks:
  hath0r-net:
    name: hath0r-net
    external: true
