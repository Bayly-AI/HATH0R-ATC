# Hath0r Docker group (compose project: hath0r)
# Network: hath0r-net | Shared edge: hath0r-nginx | Shared state: hath0r-redis
#
# Shared infra only:
#   docker compose -f deploy/docker/docker-compose.yml up -d redis nginx
# With database profile:
#   docker compose -f deploy/docker/docker-compose.yml --profile db up -d
#
# MCP is STANDALONE (sibling repo OpenSource/hath0r-mcp). Join the same network;
# do not lifecycle-manage MCP from this compose file.

name: hath0r

services:
  redis:
    image: redis:7-alpine
    container_name: Hath0r-Sessions
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hath0r_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      hath0r-net:
        aliases:
          - Hath0r-Sessions
          - hath0r-redis
          - redis
          - h0-redis
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: redis
      com.hath0r.container: Hath0r-Sessions
      com.hath0r.role: shared-state

  nginx:
    image: nginx:1.27-alpine
    container_name: Hath0r-Edge
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${HATH0R_NGINX_HOST_PORT:-38000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      hath0r-net:
        aliases:
          - Hath0r-Edge
          - hath0r-nginx
          - nginx
          - h0-nginx
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: nginx
      com.hath0r.container: Hath0r-Edge
      com.hath0r.role: shared-edge

  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: Hath0r-Data
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hath0r}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hath0r}
      POSTGRES_DB: ${POSTGRES_DB:-hath0r}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-35432}:5432"
    volumes:
      - hath0r_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hath0r} -d ${POSTGRES_DB:-hath0r}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      hath0r-net:
        aliases:
          - Hath0r-Data
          - hath0r-postgres
          - postgres
          - h0-postgres
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: postgres
      com.hath0r.container: Hath0r-Data
      com.hath0r.role: canonical-database

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: Hath0r-phoenix
    restart: unless-stopped
    ports:
      - "${HATH0R_PHOENIX_HOST_PORT:-36006}:6006"
      - "${HATH0R_PHOENIX_GRPC_PORT:-34317}:4317"
      - "${HATH0R_PHOENIX_HTTP_PORT:-34318}:4318"
    environment:
      PHOENIX_HOST: "0.0.0.0"
      PHOENIX_PORT: 6006
      PHOENIX_HOST_ROOT_PATH: "/phoenix"
      PHOENIX_GRPC_PORT: 4317
      PHOENIX_WORKING_DIR: /data
      PHOENIX_ENABLE_PROMETHEUS: "true"
    volumes:
      - hath0r_phoenix_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      hath0r-net:
        aliases:
          - Hath0r-phoenix
          - hath0r-phoenix
          - phoenix
          - h0-phoenix
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: phoenix
      com.hath0r.container: Hath0r-phoenix
      com.hath0r.role: observability

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: Hathor-MLFLOW
    restart: unless-stopped
    ports:
      - "${HATH0R_MLFLOW_HOST_PORT:-35000}:5000"
    environment:
      MLFLOW_PORT: 5000
      MLFLOW_HOST: 0.0.0.0
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////data/mlflow.db
      - --default-artifact-root
      - /data/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --static-prefix
      - /mlflow
    volumes:
      - hath0r_mlflow_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/mlflow/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      hath0r-net:
        aliases:
          - Hathor-MLFLOW
          - hath0r-mlflow
          - mlflow
          - h0-mlflow
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: mlflow
      com.hath0r.container: Hathor-MLFLOW
      com.hath0r.role: mlops-experiment-tracking

  mcp:
    profiles: ["mcp", "apps"]
    image: ${HATH0R_MCP_IMAGE:-hath0r/mcp:local}
    container_name: Hath0r-MCP
    restart: unless-stopped
    ports:
      - "${HATH0R_MCP_HOST_PORT:-38083}:8083"
    environment:
      HATH0R_MCP_ENVIRONMENT: ${HATH0R_MCP_ENVIRONMENT:-local}
      HATH0R_MCP_KNOWLEDGE_ROOT: /app/knowledgebase/canonical
      HATH0R_MCP_TOKEN: ${HATH0R_MCP_TOKEN:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    networks:
      hath0r-net:
        aliases:
          - Hath0r-MCP
          - hath0r-mcp
          - mcp
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: mcp
      com.hath0r.container: Hath0r-MCP
      com.hath0r.role: knowledge-mcp
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow:
    profiles: ["airflow"]
    image: ${HATH0R_AIRFLOW_IMAGE:-apache/airflow:2.9.3-python3.11}
    container_name: Hath0r-Airflow
    restart: unless-stopped
    command: ["standalone"]
    ports:
      - "${HATH0R_AIRFLOW_HOST_PORT:-38080}:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:38080"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    volumes:
      - hath0r_airflow_data:/opt/airflow
    networks:
      hath0r-net:
        aliases:
          - Hath0r-Airflow
          - hath0r-airflow
          - airflow
    labels:
      com.hath0r.org: bayly-ai
      com.hath0r.project: hath0r-opensource
      com.hath0r.component: airflow
      com.hath0r.container: Hath0r-Airflow
      com.hath0r.role: enterprise-orchestrator
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  hath0r_redis_data:
    name: hath0r_redis_data
  hath0r_postgres_data:
    name: hath0r_postgres_data
    external: true
  hath0r_phoenix_data:
    name: hath0r_phoenix_data
    external: true
  hath0r_mlflow_data:
    name: hath0r_mlflow_data
    external: true
  hath0r_airflow_data:
    name: hath0r_airflow_data

networks:
  hath0r-net:
    name: hath0r-net
    external: true


